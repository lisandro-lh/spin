<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Spin Doorprize</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --emerald: #10b981; --amber: #f59e0b; --rose: #ef4444; --blue: #3b82f6; 
            --text-main: #1f2937; 
            --glass-bg: rgba(255, 255, 255, 0.85);
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            
            /* Sesuai nama file di GitHub Anda */
            background-image: url('backround.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .header { 
            width: 100%; 
            display: grid; 
            grid-template-columns: 1fr auto 1fr;
            align-items: center; 
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }
        .header-left { display: flex; align-items: center; justify-content: flex-start; gap: 15px; }
        .header-center { display: flex; align-items: center; justify-content: center; }
        .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 15px; }
        
        .logo-img { height: 50px; object-fit: contain; }
        .logo-center { height: 70px; object-fit: contain; border-radius: 10px; } 

        .header button { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-reset { background-color: #ef4444; } 
        .btn-sesi { background-color: var(--blue); } 
        .header button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }

        .dashboard-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; 
            width: 100%; max-width: 1000px; margin-bottom: 20px; 
        }
        .stat-card { 
            background: var(--glass-bg); padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); text-align: center; 
            backdrop-filter: blur(5px);
        }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #4b5563; font-weight: bold; }
        .stat-card .value { font-size: 24px; font-weight: bold; }
        .text-emerald { color: var(--emerald); } .text-amber { color: var(--amber); } .text-rose { color: var(--rose); } .text-blue { color: var(--blue); }

        .main-wrapper {
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .spin-display { 
            font-family: 'Courier New', Courier, monospace; font-size: 140px; font-weight: bold; 
            color: var(--text-main); background: rgba(255, 255, 255, 0.95); 
            border: 6px solid var(--blue); border-radius: 20px; 
            padding: 30px 60px; margin-bottom: 30px; letter-spacing: 10px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); transition: all 0.3s;
            text-align: center; min-width: 400px;
        }

        .controls-wrapper {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-spin { background-color: var(--blue); font-size: 24px; padding: 18px 60px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; color: white; transition: transform 0.1s, box-shadow 0.2s; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.4); }
        .btn-spin:active { transform: scale(0.95); }
        .btn-spin:hover { box-shadow: 0 12px 20px rgba(59, 130, 246, 0.6); transform: translateY(-2px); }

        .controls-action { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .btn-action-group { display: flex; gap: 30px; justify-content: center; }
        .btn-action { width: 80px; height: 80px; border: none; font-size: 40px; color: white; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: transform 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn-action:hover { transform: scale(1.1); box-shadow: 0 12px 25px rgba(0,0,0,0.4); }
        .btn-lanjut { background-color: var(--emerald); border-radius: 50%; }
        .btn-hangus { background-color: var(--rose); clip-path: polygon(10% 0, 0 10%, 40% 50%, 0 90%, 10% 100%, 50% 60%, 90% 100%, 100% 90%, 60% 50%, 100% 10%, 90% 0, 50% 40%); border-radius: 0; box-shadow: none; width: 75px; height: 75px; }
        .btn-hangus:hover { filter: drop-shadow(0px 8px 15px rgba(239,68,68,0.5)); }
        .btn-jeda { background: rgba(0,0,0,0.7); border: none; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .btn-jeda:hover { background: rgba(0,0,0,0.9); }

        .history-container { 
            width: 100%; max-width: 1000px; background: var(--glass-bg); 
            border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            box-sizing: border-box; margin-top: 20px; backdrop-filter: blur(5px);
        }
        .history-container h2 { margin-top: 0; font-size: 18px; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .badge { display: inline-block; padding: 8px 15px; border-radius: 20px; margin: 5px; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .badge.sah { background-color: var(--amber); } .badge.hangus { background-color: var(--rose); }
        .hidden { display: none !important; }
        
        #loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; font-weight: bold; color: var(--blue); font-size: 20px; }
        
        #sync-toast { 
            position: fixed; bottom: 20px; right: 20px; 
            z-index: 50; transition: opacity 0.3s ease, transform 0.3s; opacity: 1; 
            background: rgba(255,255,255,0.8); padding: 10px; border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(5px);
        }
        .hourglass-gif { width: 50px; height: 50px; object-fit: contain; }
        .toast-hidden { opacity: 0 !important; pointer-events: none; transform: scale(0.5); }

        body.mode-layar .dashboard-grid, body.mode-layar .controls-wrapper, 
        body.mode-layar .history-container, body.mode-layar #sync-toast {
            display: none !important;
        }
        body.mode-layar .header button { display: none; } 
        body.mode-layar .logo-img { height: 80px; }
        body.mode-layar .logo-center { height: 120px; }
        body.mode-layar .header { background: transparent; box-shadow: none; backdrop-filter: none; }
        body.mode-layar .spin-display { font-size: 180px; padding: 50px 80px; border-width: 10px; }
        
        .btn-switch-mode { position: fixed; bottom: 10px; left: 10px; font-size: 12px; padding: 5px 10px; background: rgba(0,0,0,0.5); border: none; border-radius: 5px; cursor: pointer; color: white; z-index: 100; transition: background 0.3s; }
        .btn-switch-mode:hover { background: rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <button class="btn-reset" onclick="resetAll()">🔄 Reset</button>
            <img src="danatara.png" alt="Danatara" class="logo-img">
        </div>
        
        <div class="header-center">
            <img src="logohibualamo.jpeg" alt="Hibualamo" class="logo-center">
        </div>

        <div class="header-right">
            <button class="btn-sesi" onclick="pindahSesi()" id="btn-sesi-top">⏭️ Pindah Sesi</button>
            <img src="pln.png" alt="PLN" class="logo-img">
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card"><h3>Sesi Saat Ini</h3><div class="value text-blue" id="stat-sesi">-</div></div>
        <div class="stat-card"><h3>Kupon Tersedia</h3><div class="value text-emerald" id="stat-tersedia">-</div></div>
        <div class="stat-card"><h3>Pemenang (Sah)</h3><div class="value text-amber" id="stat-menang">-</div></div>
        <div class="stat-card"><h3>Kupon Hangus</h3><div class="value text-rose" id="stat-hangus">-</div></div>
    </div>

    <div class="main-wrapper">
        <div class="spin-display" id="display">0000</div>
        
        <div class="controls-wrapper">
            <div id="spin-controls">
                <button id="btn-spin" class="btn-spin" onclick="startSpin()">🎲 PUTAR SPIN</button>
            </div>
            
            <div class="controls-action hidden" id="action-controls">
                <div class="btn-action-group">
                    <button class="btn-hangus" onclick="tandai('hangus', true)" title="Hangus & Langsung Spin"></button>
                    <button class="btn-action btn-lanjut" onclick="tandai('sah', true)" title="Sah & Langsung Spin">✔</button>
                </div>
                <button class="btn-jeda" onclick="tandai('sah', false)">Simpan & Jeda (Stop Otomatis)</button>
            </div>
        </div>
    </div>

    <div class="history-container">
        <h2>Riwayat Sesi <span id="judul-sesi-riwayat">-</span></h2>
        <div id="history-list"></div>
    </div>

    <div id="sync-toast" class="toast-hidden">
        <!-- Menggunakan pasirjam.gif sesuai di repo Anda -->
        <img src="pasirjam.gif" alt="Sync" class="hourglass-gif">
    </div>
    
    <div id="loader" class="hidden">Menghubungkan ke Server...</div>

    <button class="btn-switch-mode" onclick="toggleMode()">🔄 Ganti Mode</button>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzXNZ-34VFpAevgvPEovKs6bfIiE6XdpCQrcw0XyllWs5NEPECOvAK4xvSGU18UeuE6Jw/exec';
        
        const urlParams = new URLSearchParams(window.location.search);
        let APP_MODE = urlParams.get('mode');

        if (!APP_MODE) {
            const isMobile = window.innerWidth <= 1024 || /Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent);
            APP_MODE = isMobile ? 'remote' : 'layar';
        }

        if (APP_MODE === 'layar') { document.body.classList.add('mode-layar'); }
        function toggleMode() { window.location.href = '?mode=' + (APP_MODE === 'layar' ? 'remote' : 'layar'); }

        let availableNumbers = [];
        let winners = [];
        let forfeits = [];
        let currentSession = 1;
        let isSpinning = false;
        let selectedNumber = null;
        let selectedIndex = null;
        let displaySpinInterval = null;

        function showLoader(show, text = "Memuat data...") {
            const loader = document.getElementById('loader');
            if (show) { loader.innerText = text; loader.classList.remove('hidden'); } 
            else { loader.classList.add('hidden'); }
        }

        function showToast(autoHide = false) {
            const toast = document.getElementById('sync-toast');
            toast.classList.remove('toast-hidden');
            if (autoHide) setTimeout(() => toast.classList.add('toast-hidden'), 2000);
        }

        async function fetchAPI(payload) {
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                return await response.json();
            } catch (error) { return null; }
        }

        async function initApp() {
            showLoader(true, "Sinkronisasi Data...");
            if(document.getElementById('btn-spin')) document.getElementById('btn-spin').disabled = true;
            
            const data = await fetchAPI({ action: "init" });
            if (data && data.status === "success") {
                availableNumbers = data.availableNumbers;
                winners = data.winners;
                forfeits = data.forfeits;
                currentSession = data.currentSession;
                if(APP_MODE !== 'layar') updateUI();
            }
            if(document.getElementById('btn-spin')) document.getElementById('btn-spin').disabled = false;
            showLoader(false);

            if (APP_MODE === 'layar') runDisplayPolling();
        }

        function format4(num) { return String(num).padStart(4, '0'); }

        function startSpin() {
            if (availableNumbers.length === 0) { Swal.fire('Habis!', 'Semua kupon telah diundi.', 'info'); return; }
            isSpinning = true;
            document.getElementById('spin-controls').classList.add('hidden');
            document.getElementById('action-controls').classList.add('hidden');
            document.getElementById('btn-sesi-top').disabled = true;
            
            const display = document.getElementById('display');
            display.style.color = 'var(--text-main)';
            
            fetchAPI({ action: "start_spin" });

            let duration = 2500;
            let elapsed = 0;
            let spinInterval = setInterval(() => {
                let randomIdx = Math.floor(Math.random() * availableNumbers.length);
                display.innerText = format4(availableNumbers[randomIdx]);
                elapsed += 50;
                if (elapsed >= duration) {
                    clearInterval(spinInterval);
                    finishSpin();
                }
            }, 50);
        }

        function finishSpin() {
            selectedIndex = Math.floor(Math.random() * availableNumbers.length);
            selectedNumber = availableNumbers[selectedIndex];
            
            document.getElementById('display').innerText = format4(selectedNumber);
            document.getElementById('display').style.color = 'var(--blue)';
            document.getElementById('action-controls').classList.remove('hidden');

            fetchAPI({ action: "set_result", number: selectedNumber });
        }

        function tandai(statusMark, autoLanjut = true) {
            if (statusMark === 'sah') winners.push({ number: selectedNumber, session: currentSession });
            else forfeits.push({ number: selectedNumber, session: currentSession });
            
            availableNumbers.splice(selectedIndex, 1);
            updateUI();
            
            document.getElementById('action-controls').classList.add('hidden');
            document.getElementById('display').style.color = 'var(--text-main)';
            
            showToast();
            fetchAPI({ action: statusMark, number: selectedNumber, session: currentSession }).then(res => {
                document.getElementById('sync-toast').classList.add('toast-hidden');
            });

            isSpinning = false;
            
            if (autoLanjut) {
                setTimeout(() => { startSpin(); }, 500); 
            } else {
                document.getElementById('spin-controls').classList.remove('hidden');
                document.getElementById('btn-spin').innerText = '🎲 LANJUT SPIN';
                document.getElementById('btn-sesi-top').disabled = false;
            }
        }

        async function runDisplayPolling() {
            try {
                const res = await fetchAPI({ action: "check_status" });
                if (res && res.status === "success") {
                    if (res.screenStatus === "SPINNING" && !isSpinning) {
                        isSpinning = true;
                        document.getElementById('display').style.color = 'var(--text-main)';
                        
                        displaySpinInterval = setInterval(() => {
                            let max = availableNumbers.length > 0 ? availableNumbers.length : 500;
                            let randomIdx = Math.floor(Math.random() * max);
                            let num = availableNumbers.length > 0 ? availableNumbers[randomIdx] : Math.floor(Math.random() * 500) + 1;
                            document.getElementById('display').innerText = format4(num);
                        }, 50);
                    } 
                    else if (res.screenStatus === "FINISHED" && isSpinning) {
                        isSpinning = false;
                        clearInterval(displaySpinInterval);
                        
                        document.getElementById('display').innerText = format4(res.screenNumber);
                        document.getElementById('display').style.color = 'var(--blue)';
                    }
                }
            } catch(e) {}
            setTimeout(runDisplayPolling, 1500); 
        }

        async function pindahSesi() {
            if (isSpinning || !document.getElementById('action-controls').classList.contains('hidden')) { Swal.fire('Belum Selesai!', 'Pilih status kupon (atau Jeda).', 'warning'); return; }
            if ((await Swal.fire({ title: `Pindah Sesi ${currentSession + 1}?`, icon: 'question', showCancelButton: true })).isConfirmed) {
                showLoader(true, "Memperbarui Sesi...");
                const res = await fetchAPI({ action: "pindahSesi" });
                if (res && res.status === "success") {
                    currentSession = res.newSession; document.getElementById('display').innerText = '0000'; document.getElementById('btn-spin').innerText = '🎲 PUTAR SPIN'; updateUI();
                }
                showLoader(false);
            }
        }

        async function resetAll() {
            if (isSpinning) return;
            if ((await Swal.fire({ title: 'Reset Data?', icon: 'warning', showCancelButton: true })).isConfirmed) {
                if ((await Swal.fire({ title: 'Konfirmasi Terakhir!', text: "Menghapus semua dari Sheets!", icon: 'error', showCancelButton: true })).isConfirmed) {
                    showLoader(true, "Mereset Sheets...");
                    const res = await fetchAPI({ action: "reset" });
                    if (res && res.status === "success") { initApp(); Swal.fire('Berhasil', 'Sistem kembali ke awal.', 'success'); }
                    else { showLoader(false); Swal.fire('Gagal!', 'Error koneksi.', 'error'); }
                }
            }
        }

        function updateUI() {
            if(APP_MODE === 'layar') return;
            document.getElementById('stat-sesi').innerText = currentSession;
            document.getElementById('stat-tersedia').innerText = availableNumbers.length;
            document.getElementById('stat-menang').innerText = winners.length;
            document.getElementById('stat-hangus').innerText = forfeits.length;
            document.getElementById('judul-sesi-riwayat').innerText = currentSession;
            const historyList = document.getElementById('history-list'); historyList.innerHTML = '';
            winners.filter(w => w.session === currentSession).forEach(w => { let s = document.createElement('span'); s.className = 'badge sah'; s.innerText = `✅ ${format4(w.number)}`; historyList.appendChild(s); });
            forfeits.filter(f => f.session === currentSession).forEach(f => { let s = document.createElement('span'); s.className = 'badge hangus'; s.innerText = `❌ ${format4(f.number)}`; historyList.appendChild(s); });
        }

        initApp();
    </script>
</body>
</html>
