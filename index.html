<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Spin Doorprize</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { 
            --emerald: #10b981; --amber: #f59e0b; --rose: #ef4444; --blue: #3b82f6; 
            --text-main: #1f2937; 
            --glass-bg: rgba(255, 255, 255, 0.88);
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: var(--text-main); margin: 0; padding: 15px; display: flex; 
            flex-direction: column; align-items: center; min-height: 100vh; width: 100%;
            overflow-x: hidden; background-image: url('backround.jpeg');
            background-size: cover; background-position: center; background-attachment: fixed;
            background-repeat: no-repeat;
        }
        .header { 
            width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 15px; background: rgba(255, 255, 255, 0.78); padding: 12px 20px;
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); backdrop-filter: blur(6px); 
        }
        .header-top-row { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
        .header-left { display: flex; align-items: center; justify-content: flex-start; gap: 10px; min-width: 0; }
        .header-center { display: flex; align-items: center; justify-content: center; }
        .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
        .logo-img { height: clamp(28px, 5vw, 52px); max-width: 100%; object-fit: contain; }
        .logo-center { height: clamp(38px, 6.5vw, 72px); max-width: 100%; object-fit: contain; border-radius: 8px; } 
        .header button { 
            padding: 8px 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 13px;
            cursor: pointer; transition: all 0.2s; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.2); white-space: nowrap;
        }
        .btn-reset { background-color: var(--rose); } 
        .btn-sesi { background-color: var(--blue); } 
        .btn-export { background-color: var(--emerald); } 
        .header button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
        .header button:active { transform: scale(0.96); }
        .mobile-action-bar { display: none; width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-top: 6px; border-top: 1px solid rgba(0,0,0,0.1); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 1000px; margin-bottom: 15px; }
        .stat-card { background: var(--glass-bg); padding: 12px 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.12); text-align: center; backdrop-filter: blur(5px); }
        .stat-card h3 { margin: 0 0 5px 0; font-size: clamp(11px, 2.5vw, 14px); color: #4b5563; font-weight: bold; }
        .stat-card .value { font-size: clamp(18px, 4vw, 24px); font-weight: bold; }
        .text-emerald { color: var(--emerald); } .text-amber { color: var(--amber); } .text-rose { color: var(--rose); } .text-blue { color: var(--blue); }
        .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        .layar-session-badge { display: none; background: var(--blue); color: white; font-weight: bold; font-size: clamp(16px, 2.5vw, 26px); padding: 8px 30px; border-radius: 50px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); letter-spacing: 2px; }
        .spin-display { font-family: 'Courier New', Courier, monospace; font-size: clamp(65px, 16vw, 140px); font-weight: bold; color: var(--text-main); background: rgba(255, 255, 255, 0.96); border: 6px solid var(--blue); border-radius: 20px; padding: clamp(15px, 3vw, 30px) clamp(25px, 6vw, 60px); margin-bottom: 20px; letter-spacing: clamp(4px, 1.5vw, 10px); box-shadow: 0 15px 35px rgba(0,0,0,0.25); transition: color 0.2s; text-align: center; width: auto; max-width: 95vw; }
        .controls-wrapper { background: rgba(255, 255, 255, 0.88); padding: 18px 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.18); backdrop-filter: blur(5px); min-height: 110px; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 500px; }
        .btn-spin { background-color: var(--blue); font-size: clamp(18px, 4.5vw, 24px); padding: 16px 45px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; color: white; transition: transform 0.1s, box-shadow 0.2s; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.4); width: 100%; }
        .btn-spin:active { transform: scale(0.95); } .btn-spin:hover { box-shadow: 0 12px 20px rgba(59, 130, 246, 0.6); transform: translateY(-2px); }
        .spinning-status-box { font-size: 18px; font-weight: bold; color: var(--blue); display: flex; align-items: center; gap: 10px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .controls-action { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
        .action-prompt { font-size: 14px; font-weight: bold; color: #374151; margin: 0; text-align: center; }
        .btn-action-group { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .btn-choice { flex: 1; padding: 14px 12px; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 6px 15px rgba(0,0,0,0.2); transition: transform 0.15s; }
        .btn-choice:active { transform: scale(0.95); } .btn-choice span.sub { font-size: 11px; font-weight: normal; opacity: 0.9; }
        .btn-choice.sah { background-color: var(--emerald); } .btn-choice.hangus { background-color: var(--rose); }
        .jeda-group { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; border-top: 1px dashed #d1d5db; padding-top: 10px; }
        .btn-jeda { background: rgba(31, 41, 55, 0.85); border: none; color: white; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; flex: 1; }
        .btn-jeda:hover { background: #000; }
        .history-container { width: 100%; max-width: 1000px; background: var(--glass-bg); border-radius: 12px; padding: 15px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-top: 15px; margin-bottom: 35px; backdrop-filter: blur(5px); }
        .history-container h2 { margin-top: 0; font-size: 16px; border-bottom: 2px solid #ccc; padding-bottom: 8px; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; margin: 4px; font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: bold; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .badge.sah { background-color: var(--amber); } .badge.hangus { background-color: var(--rose); }
        .hidden { display: none !important; }
        
        body.mode-layar .dashboard-grid, body.mode-layar .controls-wrapper, body.mode-layar .history-container, body.mode-layar .header button, body.mode-layar .mobile-action-bar { display: none !important; }
        body.mode-layar .layar-session-badge { display: inline-block; }
        body.mode-layar .header { background: transparent; box-shadow: none; backdrop-filter: none; margin-bottom: 5px; }
        body.mode-layar .logo-img { height: clamp(38px, 6vw, 75px); max-width: 26vw; } 
        body.mode-layar .logo-center { height: clamp(50px, 8vw, 105px); max-width: 34vw; }
        body.mode-layar .spin-display { font-size: clamp(75px, 18vw, 190px); padding: clamp(25px, 5vw, 50px) clamp(35px, 7vw, 85px); border-width: 8px; }
        .btn-switch-mode { position: fixed; bottom: 10px; left: 10px; font-size: 12px; padding: 6px 12px; background: rgba(0,0,0,0.6); border: none; border-radius: 6px; cursor: pointer; color: white; z-index: 100; transition: background 0.3s; }
        .btn-switch-mode:hover { background: rgba(0,0,0,0.85); }
        #audio-unlock-banner { position: fixed; top: 0; left: 0; width: 100%; background: #2563eb; color: white; text-align: center; padding: 10px; font-weight: bold; z-index: 9999; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; }
        
        /* Modal Rekap Sesi */
        .rekap-wrapper { display: flex; gap: 15px; justify-content: space-between; text-align: center; margin-top: 10px; }
        .rekap-col { flex: 1; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px 8px; }
        .rekap-col h4 { margin: 0 0 10px 0; font-size: clamp(14px, 3vw, 18px); padding-bottom: 8px; border-bottom: 2px solid #e5e7eb; }
        .rekap-list { max-height: 45vh; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 4px; }
        .rekap-item { font-family: 'Courier New', Courier, monospace; font-size: clamp(14px, 3.2vw, 20px); font-weight: bold; padding: 5px 10px; border-radius: 8px; color: white; }
        .rekap-item.sah { background-color: var(--amber); } .rekap-item.hangus { background-color: var(--rose); }
        
        .sesi-group { margin-bottom: 20px; padding: 10px; background: rgba(255,255,255,0.6); border-radius: 10px; border-left: 4px solid var(--blue); }
        .sesi-title { margin: 0 0 10px 0; font-size: 15px; color: var(--blue); font-weight: bold; }

        @media (max-width: 768px) {
            body { padding: 10px; } .header { padding: 10px 12px; } .desktop-btn { display: none !important; }
            .mobile-action-bar { display: flex; } .mobile-action-bar button { flex: 1; padding: 8px; font-size: 12px; }
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } .rekap-wrapper { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div id="audio-unlock-banner" onclick="unlockAudioSession()">🔊 [KLIK DI SINI] Agar Suara Putar Spin Aktif di Layar Ini</div>
    <audio id="sound-spin" src="sounddrum.mp3" preload="auto" loop></audio>

    <div class="header">
        <div class="header-top-row">
            <div class="header-left">
                <img src="danatara.png" alt="Danatara" class="logo-img">
                <button class="btn-reset desktop-btn" onclick="resetAll()">🔄 Setup Awal</button>
            </div>
            <div class="header-center">
                <img src="logohibualamo.jpeg" alt="Hibualamo" class="logo-center">
            </div>
            <div class="header-right">
                <button class="btn-export desktop-btn" onclick="exportToCSV()">📥 Export CSV</button>
                <button class="btn-sesi desktop-btn" onclick="pindahSesi()">⏭️ Pindah Sesi Baru</button>
                <img src="pln.png" alt="PLN" class="logo-img">
            </div>
        </div>
        <div class="mobile-action-bar">
            <button class="btn-reset" onclick="resetAll()">🔄 Setup</button>
            <button class="btn-export" onclick="exportToCSV()">📥 Export</button>
            <button class="btn-sesi" onclick="pindahSesi()">⏭️ Sesi Baru</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card"><h3>Sesi Saat Ini</h3><div class="value text-blue" id="stat-sesi">-</div></div>
        <div class="stat-card"><h3>Kupon Tersedia</h3><div class="value text-emerald" id="stat-tersedia">-</div></div>
        <div class="stat-card"><h3>Pemenang (Sah)</h3><div class="value text-amber" id="stat-menang">-</div></div>
        <div class="stat-card"><h3>Kupon Hangus</h3><div class="value text-rose" id="stat-hangus">-</div></div>
    </div>

    <div class="main-wrapper">
        <div class="layar-session-badge" id="layar-session-badge">SESI UNDIAN <span id="layar-sesi-text">1</span></div>
        <div class="spin-display" id="display">0000</div>
        
        <div class="controls-wrapper">
            <div id="spin-controls" style="width: 100%;">
                <button id="btn-spin" class="btn-spin" onclick="startSpin()">🎲 PUTAR SPIN</button>
            </div>
            <div id="spinning-status" class="spinning-status-box hidden">
                🎲 Mengacak Nomor Kupon...
            </div>
            <div class="controls-action hidden" id="action-controls">
                <p class="action-prompt">Tentukan Status Nomor <span id="label-nomor-keluar" style="color:var(--blue);">0000</span>:</p>
                <div class="btn-action-group">
                    <button class="btn-choice hangus" onclick="tandai('hangus', true)">❌ HANGUS<span class="sub">Catat Gugur & Spin Lagi</span></button>
                    <button class="btn-choice sah" onclick="tandai('sah', true)">✔ SAH / LANJUT<span class="sub">Catat Menang & Spin Lagi</span></button>
                </div>
                <div class="jeda-group">
                    <button class="btn-jeda" onclick="tandai('sah', false)">⏸️ Catat SAH & Berhenti</button>
                    <button class="btn-jeda" style="background: rgba(185, 28, 28, 0.85);" onclick="tandai('hangus', false)">⏸️ Catat HANGUS & Berhenti</button>
                </div>
            </div>
        </div>
    </div>

    <div class="history-container">
        <h2>Riwayat Pemenang & Hangus</h2>
        <div id="history-list"></div>
    </div>

    <button class="btn-switch-mode" id="btn-mode-label" onclick="toggleMode()">🔄 Ganti Mode</button>

    <script>
        // =======================================================
        // LINK WEB APP SPREADSHEET (TERHUBUNG OTOMATIS)
        const BACKUP_SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbyQhgsuzE-LQWP1grHpSQeeRAyZDGT5OubZc9cXJ6uwIWvH3FfClh-gA3a1mxij6FfEyQ/exec";
        // =======================================================

        const firebaseConfig = {
            apiKey: "AIzaSyBzq8JfbAOkLG9Jch-nBxvGQ8r-K77DVy8",
            authDomain: "spin-hibualamo-pln.firebaseapp.com",
            databaseURL: "https://spin-hibualamo-pln-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "spin-hibualamo-pln",
            storageBucket: "spin-hibualamo-pln.firebasestorage.app",
            messagingSenderId: "1091000294809",
            appId: "1:1091000294809:web:e66ed958bc0a6250ad0708"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dataRef = db.ref('data');
        const stateRef = db.ref('appState');

        const urlParams = new URLSearchParams(window.location.search);
        let APP_MODE = urlParams.get('mode');

        if (!APP_MODE) {
            const isMobile = window.innerWidth <= 900 || /Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent);
            APP_MODE = isMobile ? 'remote' : 'layar';
        }

        if (APP_MODE === 'layar') { 
            document.body.classList.add('mode-layar'); 
            document.getElementById('btn-mode-label').innerText = '📱 Ke Mode Remote';
        } else {
            document.getElementById('btn-mode-label').innerText = '🖥️ Ke Mode Layar';
        }

        function toggleMode() { window.location.href = '?mode=' + (APP_MODE === 'layar' ? 'remote' : 'layar'); }

        let availableNumbers = [];
        let winners = [];
        let forfeits = [];
        let currentSession = 1;
        let activeSheetName = "Riwayat_Acara";
        
        let isSpinning = false;
        let selectedNumber = null;
        let displaySpinInterval = null;
        let lastHandledSpinStatus = "IDLE";
        let isRekapModalOpen = false;
        let isAudioUnlocked = false;

        async function setupAwal() {
            if (APP_MODE === 'layar') {
                document.getElementById('display').innerText = "MENUNGGU HOST";
                document.getElementById('display').style.fontSize = "clamp(30px, 8vw, 60px)";
                return;
            }
            
            const { value: totalKupon } = await Swal.fire({
                title: '⚙️ Setup Aplikasi Undian',
                input: 'number',
                inputLabel: 'Masukkan Jumlah Total Kupon (Contoh: 1000)',
                inputPlaceholder: 'Ketik angka batas maksimal kupon...',
                allowOutsideClick: false,
                showCancelButton: true,
                confirmButtonText: 'Mulai Acara 🚀',
                confirmButtonColor: '#10b981',
                cancelButtonText: 'Batal',
                inputValidator: (value) => {
                    if (!value || value <= 0) return 'Masukkan angka yang valid!';
                }
            });

            if (totalKupon) {
                let nums = [];
                for(let i=1; i<=totalKupon; i++) nums.push(i);
                
                const tgl = new Date().toISOString().slice(0, 10);
                const rand = Math.floor(Math.random() * 1000);
                const newSheetName = "Acara_" + tgl + "_" + rand;

                await dataRef.set({
                    availableNumbers: nums,
                    winners: [],
                    forfeits: [],
                    currentSession: 1,
                    activeSheetName: newSheetName
                });
                await stateRef.set({ status: "IDLE", screenNumber: "0000" });
                
                // KIRIM SINYAL BUAT TAB SHEET BARU OTOMATIS SAAT SETUP/RESET
                fetch(BACKUP_SPREADSHEET_URL, {
                    method: 'POST',
                    body: JSON.stringify({ sheetName: newSheetName, data: [] })
                }).catch(e => console.log("Init sheet error", e));
                
                document.getElementById('display').style.fontSize = ""; 
                Swal.fire('Berhasil', `Sistem siap dengan ${totalKupon} kupon!\n\nTab Sheet baru otomatis dibuat di Spreadsheet:${newSheetName}`, 'success');
            }
        }

        function initApp() {
            if (APP_MODE === 'layar' && !isAudioUnlocked) {
                document.getElementById('audio-unlock-banner').style.display = 'block';
            }

            dataRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    if (APP_MODE !== 'layar') setupAwal();
                    else {
                        document.getElementById('display').innerText = "MENUNGGU HOST";
                        document.getElementById('display').style.fontSize = "clamp(30px, 8vw, 60px)";
                    }
                    return;
                }
                document.getElementById('display').style.fontSize = "";
                availableNumbers = data.availableNumbers || [];
                winners = data.winners || [];
                forfeits = data.forfeits || [];
                currentSession = data.currentSession || 1;
                activeSheetName = data.activeSheetName || "Riwayat_Acara";
                updateUI();
            });

            stateRef.on('value', (snapshot) => {
                const state = snapshot.val();
                if (!state) return;

                const serverStatus = state.status || "IDLE";

                if (serverStatus === "SPINNING" && serverStatus !== lastHandledSpinStatus) {
                    lastHandledSpinStatus = serverStatus;
                    if (isRekapModalOpen) { Swal.close(); isRekapModalOpen = false; }

                    isSpinning = true;
                    setControlState('SPINNING');
                    playSpinAudio();

                    const display = document.getElementById('display');
                    display.style.color = 'var(--text-main)';
                    
                    clearInterval(displaySpinInterval);
                    displaySpinInterval = setInterval(() => {
                        let max = availableNumbers.length > 0 ? availableNumbers.length : 500;
                        let randomIdx = Math.floor(Math.random() * max);
                        let num = availableNumbers.length > 0 ? availableNumbers[randomIdx] : Math.floor(Math.random() * 500) + 1;
                        display.innerText = format4(num);
                    }, 50);
                }
                else if (serverStatus === "ACTION" && serverStatus !== lastHandledSpinStatus) {
                    lastHandledSpinStatus = serverStatus;
                    selectedNumber = state.screenNumber;
                    clearInterval(displaySpinInterval);
                    
                    isSpinning = false;
                    stopSpinAudio();
                    
                    const display = document.getElementById('display');
                    display.innerText = format4(selectedNumber);
                    display.style.color = 'var(--blue)';
                    setControlState('ACTION');
                }
                else if (serverStatus === "IDLE" && serverStatus !== lastHandledSpinStatus) {
                    lastHandledSpinStatus = serverStatus;
                    isSpinning = false;
                    selectedNumber = null;
                    stopSpinAudio();
                    document.getElementById('display').innerText = '0000';
                    document.getElementById('display').style.color = 'var(--text-main)';
                    setControlState('IDLE');
                    if (isRekapModalOpen) { Swal.close(); isRekapModalOpen = false; }
                }
                else if (serverStatus.startsWith("REKAP_") && serverStatus !== lastHandledSpinStatus) {
                    lastHandledSpinStatus = serverStatus;
                    openRekapModal(currentSession);
                }
            });
        }

        async function startSpin() {
            if (isSpinning) return;
            if (availableNumbers.length === 0) { 
                Swal.fire('Habis!', 'Semua kupon telah diundi.', 'info'); 
                return; 
            }
            
            const randomIdx = Math.floor(Math.random() * availableNumbers.length);
            const chosenNumber = availableNumbers[randomIdx];

            stateRef.update({ status: "SPINNING", spinId: Date.now() });

            setTimeout(() => {
                stateRef.update({ status: "ACTION", screenNumber: chosenNumber });
            }, 4500); 
        }

        async function tandai(statusMark, autoLanjut = true) {
            if (!selectedNumber || isSpinning) return;
            const numToSave = selectedNumber; const sessToSave = currentSession;

            if (statusMark === 'sah') {
                winners = winners || [];
                winners.push({ number: numToSave, session: sessToSave });
            } else {
                forfeits = forfeits || [];
                forfeits.push({ number: numToSave, session: sessToSave });
            }
            
            let idx = availableNumbers.findIndex(x => String(x).trim() === String(numToSave).trim() || Number(x) === Number(numToSave));
            if (idx > -1) availableNumbers.splice(idx, 1);
            
            await dataRef.update({ availableNumbers, winners, forfeits });
            await stateRef.update({ status: "IDLE", screenNumber: "0000" });

            if (autoLanjut) {
                setTimeout(() => startSpin(), 600); 
            }
        }

        // OTOMATIS KIRIM DATA KE SPREADSHEET SAAT KLIK PINDAH SESI
        async function pindahSesi() {
            if (isSpinning) { Swal.fire('Tunggu!', 'Putaran sedang berjalan.', 'warning'); return; }
            
            let nowTime = new Date().toLocaleString('id-ID');
            let backupData = [];
            winners.filter(w => Number(w.session) === currentSession).forEach(w => backupData.push({ time: nowTime, session: w.session, number: format4(w.number), status: "SAH" }));
            forfeits.filter(f => Number(f.session) === currentSession).forEach(f => backupData.push({ time: nowTime, session: f.session, number: format4(f.number), status: "HANGUS" }));
            
            if(backupData.length > 0) {
                fetch(BACKUP_SPREADSHEET_URL, {
                    method: 'POST',
                    body: JSON.stringify({ sheetName: activeSheetName, data: backupData })
                }).catch(e => console.log("Backup error", e));
            }

            stateRef.update({ status: "REKAP_" + currentSession });
        }

        async function resetAll() {
            if (isSpinning) return;
            const ask = await Swal.fire({ 
                title: 'Reset & Setup Ulang Acara?', 
                text: 'Ini akan menutup sesi acara saat ini dan membuat Tab Sheet baru di Spreadsheet Anda secara otomatis!', 
                icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' 
            });
            if (ask.isConfirmed) {
                await dataRef.remove(); 
                await stateRef.update({ status: "IDLE", screenNumber: "0000" });
            }
        }

        function exportToCSV() {
            if (winners.length === 0 && forfeits.length === 0) {
                Swal.fire('Kosong', 'Belum ada data riwayat untuk diekspor.', 'info');
                return;
            }
            let csv = "Waktu Tercatat,Sesi Undian,Nomor Kupon,Status Kupon\n";
            let nowTime = new Date().toLocaleString('id-ID');
            
            for (let i = 1; i <= currentSession; i++) {
                winners.filter(w => Number(w.session) === i).forEach(w => csv += `${nowTime},Sesi ${w.session},${format4(w.number)},SAH\n`);
                forfeits.filter(f => Number(f.session) === i).forEach(f => csv += `${nowTime},Sesi ${f.session},${format4(f.number)},HANGUS\n`);
            }
            
            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Backup_Spin_${activeSheetName}.csv`;
            link.click();
        }

        function format4(num) { 
            if (!num || String(num) === "0000") return "0000";
            return String(num).padStart(4, '0'); 
        }

        function setControlState(state) {
            if (APP_MODE === 'layar') return;
            const spinCtrl = document.getElementById('spin-controls');
            const spinStatus = document.getElementById('spinning-status');
            const actionCtrl = document.getElementById('action-controls');
            spinCtrl.classList.add('hidden'); spinStatus.classList.add('hidden'); actionCtrl.classList.add('hidden');

            if (state === 'IDLE') spinCtrl.classList.remove('hidden');
            else if (state === 'SPINNING') spinStatus.classList.remove('hidden');
            else if (state === 'ACTION') {
                document.getElementById('label-nomor-keluar').innerText = format4(selectedNumber);
                actionCtrl.classList.remove('hidden');
            }
        }

        function buildRekapHTML(sess) {
            let sesiWinners = winners.filter(w => Number(w.session) === Number(sess)).map(w => format4(w.number));
            let sesiForfeits = forfeits.filter(f => Number(f.session) === Number(sess)).map(f => format4(f.number));
            return `
                <div class="rekap-wrapper">
                    <div class="rekap-col"><h4 style="color: #d97706;">🏆 Pemenang Sah (${sesiWinners.length})</h4>
                        <div class="rekap-list">${sesiWinners.length > 0 ? sesiWinners.map(n => `<span class="rekap-item sah">✅ ${n}</span>`).join('') : '<span style="font-size: 14px; color: #6b7280;">Belum ada</span>'}</div>
                    </div>
                    <div class="rekap-col"><h4 style="color: #ef4444;">❌ Hangus / Gugur (${sesiForfeits.length})</h4>
                        <div class="rekap-list">${sesiForfeits.length > 0 ? sesiForfeits.map(n => `<span class="rekap-item hangus">❌ ${n}</span>`).join('') : '<span style="font-size: 14px; color: #6b7280;">Tidak ada</span>'}</div>
                    </div>
                </div>`;
        }

        function openRekapModal(sess) {
            if (isRekapModalOpen) return;
            isRekapModalOpen = true;

            const htmlRekap = buildRekapHTML(sess) + (APP_MODE !== 'layar' ? `<p style="margin-top: 15px; font-weight: bold; color: #374151;">Tutup Sesi ${sess} dan lanjut ke Sesi${sess + 1}?</p>` : ``);

            Swal.fire({
                title: `🏁 REKAP HASIL SESI ${sess}`, html: htmlRekap, width: '92%',
                showCancelButton: APP_MODE !== 'layar', allowOutsideClick: false,
                confirmButtonColor: '#3b82f6', cancelButtonColor: '#6b7280',
                confirmButtonText: APP_MODE !== 'layar' ? `⏭️ Lanjut Sesi ${sess + 1}` : 'Tutup Tampilan',
                cancelButtonText: 'Batal / Kembali'
            }).then(async (result) => {
                isRekapModalOpen = false;
                if (APP_MODE !== 'layar') {
                    if (result.isConfirmed) {
                        currentSession++;
                        await dataRef.update({ currentSession: currentSession });
                        await stateRef.update({ status: "IDLE" });
                        Swal.fire({ title: 'Berhasil!', text: `Sesi ${currentSession} dimulai!\nData Sesi ${sess} sukses terkirim ke Spreadsheet.`, icon: 'success', timer: 2500, showConfirmButton: false });
                    } else {
                        stateRef.update({ status: "IDLE" });
                    }
                }
            });
        }

        function updateUI() {
            document.getElementById('layar-session-badge').style.display = (APP_MODE === 'layar') ? 'inline-block' : 'none';
            document.getElementById('layar-sesi-text').innerText = currentSession;
            if(APP_MODE === 'layar') return;
            
            document.getElementById('stat-sesi').innerText = currentSession;
            document.getElementById('stat-tersedia').innerText = availableNumbers.length;
            document.getElementById('stat-menang').innerText = winners.length;
            document.getElementById('stat-hangus').innerText = forfeits.length;
            
            const historyList = document.getElementById('history-list'); 
            historyList.innerHTML = '';
            
            for (let i = currentSession; i >= 1; i--) {
                let wSess = winners.filter(w => Number(w.session) === i);
                let fSess = forfeits.filter(f => Number(f.session) === i);
                
                if (wSess.length > 0 || fSess.length > 0) {
                    let div = document.createElement('div');
                    div.className = 'sesi-group';
                    div.innerHTML = `<div class="sesi-title">🔹 Riwayat Sesi ${i}</div>`;
                    wSess.forEach(w => { div.innerHTML += `<span class="badge sah">✅ ${format4(w.number)}</span>`; });
                    fSess.forEach(f => { div.innerHTML += `<span class="badge hangus">❌ ${format4(f.number)}</span>`; });
                    historyList.appendChild(div);
                }
            }
            if (historyList.innerHTML === '') historyList.innerHTML = '<span style="font-size: 14px; color: #6b7280;">Belum ada riwayat.</span>';
        }

        function unlockAudioSession() {
            if (isAudioUnlocked) return;
            const audio = document.getElementById('sound-spin');
            if (audio) {
                audio.play().then(() => {
                    audio.pause(); audio.currentTime = 0;
                    isAudioUnlocked = true;
                    document.getElementById('audio-unlock-banner').style.display = 'none';
                }).catch(e => console.log("Gagal Unlock Audio:", e));
            }
        }
        document.addEventListener('click', () => { if (!isAudioUnlocked) unlockAudioSession(); }, { once: true });

        function playSpinAudio() {
            const audio = document.getElementById('sound-spin');
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {
                if (APP_MODE === 'layar') document.getElementById('audio-unlock-banner').style.display = 'block';
            });}
        }
        function stopSpinAudio() {
            const audio = document.getElementById('sound-spin');
            if (audio) { audio.pause(); audio.currentTime = 0; }
        }

        initApp();
    </script>
</body>
</html>
