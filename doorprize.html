<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Doorprize</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: #fff;
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            margin-top: 0;
        }
        .setup-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .input-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        .input-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            width: 120px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .spin-display {
            font-size: 80px;
            font-weight: bold;
            color: #ff3d00;
            background: #f9f9f9;
            border: 4px dashed #ddd;
            border-radius: 12px;
            margin: 30px 0;
            padding: 40px 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-spin {
            background-color: #ff3d00;
            font-size: 24px;
            padding: 15px 40px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 12px rgba(255, 61, 0, 0.3);
        }
        .btn-spin:hover {
            background-color: #dd2c00;
        }
        .history-section {
            margin-top: 30px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .history-section h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            margin: 5px;
            font-size: 16px;
            font-weight: bold;
            animation: popIn 0.3s ease-out;
        }
        .status {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Spin Doorprize</h1>
    
    <div class="setup-section">
        <div class="input-group">
            <label for="minVal">Angka Mulai</label>
            <input type="number" id="minVal" value="1">
        </div>
        <div class="input-group">
            <label for="maxVal">Angka Akhir</label>
            <input type="number" id="maxVal" value="50">
        </div>
        <div class="input-group" style="justify-content: flex-end;">
            <button onclick="generateList()">Buat Daftar</button>
        </div>
    </div>

    <div class="status" id="status-text">Silakan buat daftar angka terlebih dahulu.</div>

    <div class="spin-display" id="display">00</div>

    <button class="btn-spin" id="btn-spin" onclick="startSpin()" disabled>SPIN!</button>

    <div class="history-section">
        <h3>🏆 Pemenang Terpilih:</h3>
        <div id="history-list"></div>
    </div>
</div>

<script>
    let availableNumbers = [];
    let isSpinning = false;

    // Fungsi untuk membuat array angka berdasarkan input
    function generateList() {
        const min = parseInt(document.getElementById('minVal').value);
        const max = parseInt(document.getElementById('maxVal').value);

        if (isNaN(min) || isNaN(max) || min > max) {
            alert("Masukkan rentang angka yang valid!");
            return;
        }

        availableNumbers = [];
        for (let i = min; i <= max; i++) {
            availableNumbers.push(i);
        }

        // Reset tampilan
        document.getElementById('display').innerText = "00";
        document.getElementById('history-list').innerHTML = "";
        document.getElementById('btn-spin').disabled = false;
        
        updateStatus();
    }

    // Fungsi untuk memulai animasi spin
    function startSpin() {
        if (availableNumbers.length === 0) {
            alert("Semua angka sudah terpilih! Silakan buat daftar baru.");
            return;
        }
        if (isSpinning) return;

        isSpinning = true;
        document.getElementById('btn-spin').disabled = true;
        
        const display = document.getElementById('display');
        let spinDuration = 3000; // Lama animasi spin (3 detik)
        let intervalTime = 50;   // Kecepatan pergantian angka
        let elapsed = 0;

        // Efek angka acak berputar
        let spinInterval = setInterval(() => {
            let randomIndex = Math.floor(Math.random() * availableNumbers.length);
            display.innerText = availableNumbers[randomIndex];
            elapsed += intervalTime;

            if (elapsed >= spinDuration) {
                clearInterval(spinInterval);
                finishSpin();
            }
        }, intervalTime);
    }

    // Fungsi saat spin selesai
    function finishSpin() {
        // Pilih satu index secara acak
        let winningIndex = Math.floor(Math.random() * availableNumbers.length);
        
        // Ambil dan hapus angka tersebut dari array (splice)
        let winner = availableNumbers.splice(winningIndex, 1)[0];
        
        // Tampilkan hasil akhir
        document.getElementById('display').innerText = winner;
        
        // Tambahkan ke riwayat pemenang
        addHistory(winner);
        
        updateStatus();
        isSpinning = false;
        
        if (availableNumbers.length > 0) {
            document.getElementById('btn-spin').disabled = false;
        }
    }

    // Fungsi untuk memperbarui sisa angka
    function updateStatus() {
        document.getElementById('status-text').innerText = "Sisa peserta yang belum terpilih: " + availableNumbers.length;
    }

    // Fungsi untuk menambahkan badge pemenang ke daftar riwayat
    function addHistory(number) {
        const historyList = document.getElementById('history-list');
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.innerText = number;
        historyList.appendChild(badge);
    }
</script>

</body>
</html>
